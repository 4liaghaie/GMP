name: gmp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:-gomrokmp.com},www.${DOMAIN:-gomrokmp.com},backend
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN:-gomrokmp.com},https://www.${DOMAIN:-gomrokmp.com}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:-gomrokmp.com},https://www.${DOMAIN:-gomrokmp.com}
      CORS_ALLOW_ALL_ORIGINS: "0"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ${MEDIA_HOST_PATH:-/var/www/gmp-media}:/app/media
      - static_data:/app/staticfiles
    networks:
      - internal
    init: true
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://gomrokmp.com/api}
        NEXT_PUBLIC_RUBIKA_USERNAME: ${NEXT_PUBLIC_RUBIKA_USERNAME:-}
        NEXT_PUBLIC_RUBIKA_LINK: ${NEXT_PUBLIC_RUBIKA_LINK:-}
        NEXT_PUBLIC_BALE_USERNAME: ${NEXT_PUBLIC_BALE_USERNAME:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    init: true
    logging: *default-logging

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-gomrokmp.com}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - tls_certs:/etc/nginx/tls
      - static_data:/var/www/static:ro
      - ${MEDIA_HOST_PATH:-/var/www/gmp-media}:/var/www/media:ro
    networks:
      - internal
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.4.0
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN:-gomrokmp.com}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          if certbot certonly \
            --webroot --webroot-path /var/www/certbot \
            --cert-name "$$DOMAIN" \
            --domain "$$DOMAIN" --domain "www.$$DOMAIN" \
            --email "$$LETSENCRYPT_EMAIL" \
            --agree-tos --no-eff-email --non-interactive \
            --keep-until-expiring; then
            cp "/etc/letsencrypt/live/$$DOMAIN/fullchain.pem" /etc/nginx/tls/fullchain.pem.new
            cp "/etc/letsencrypt/live/$$DOMAIN/privkey.pem" /etc/nginx/tls/privkey.pem.new
            chmod 644 /etc/nginx/tls/fullchain.pem.new
            chmod 600 /etc/nginx/tls/privkey.pem.new
            mv /etc/nginx/tls/fullchain.pem.new /etc/nginx/tls/fullchain.pem
            mv /etc/nginx/tls/privkey.pem.new /etc/nginx/tls/privkey.pem
            sleep 12h & wait $$!
          else
            echo "Certificate request failed; retrying in 30 minutes. Check DNS and ports 80/443."
            sleep 30m & wait $$!
          fi
        done
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - tls_certs:/etc/nginx/tls
    networks:
      - internal
    init: true
    logging: *default-logging

volumes:
  postgres_data:
  static_data:
  certbot_conf:
  certbot_www:
  tls_certs:

networks:
  internal:
    driver: bridge
